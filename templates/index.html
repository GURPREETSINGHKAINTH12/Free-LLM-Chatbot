<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free LLM Chatbot</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-muted: #8888a0;
      --accent: #6c5ce7;
      --accent-hover: #5b4cdb;
      --user-msg: #2d2d38;
      --bot-msg: #252530;
      --danger: #e05c5c;
      --radius: 12px;
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .chat-container {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 460px;
      max-height: 78vh;
    }
    .docs-bar {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.02);
    }
    .docs-bar-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .doc-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bot-msg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      color: var(--text);
    }
    .doc-pill button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
    }
    .doc-pill button:hover { color: var(--danger); }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--bot-msg);
      border: 1px solid var(--border);
    }
    .message .role-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.8;
      margin-bottom: 0.25rem;
    }
    .message .sources {
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    #message-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    #message-input::placeholder { color: var(--text-muted); }
    #message-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .controls label { display: flex; align-items: center; gap: 0.35rem; }
    #temperature {
      width: 100px;
      height: 6px;
      accent-color: var(--accent);
    }
    #temperature-value { min-width: 2.5ch; }
    .secondary-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .secondary-btn:hover { border-color: var(--accent); }
    .secondary-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .status.error { color: var(--danger); }
    .typing {
      opacity: 0.7;
      font-style: italic;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Free LLM Chatbot</h1>
  <p class="subtitle">Ollama (local) or Hugging Face · Persistent SQLite history · Document RAG</p>

  <div class="chat-container">
    <div id="docs-bar" class="docs-bar">
      <span class="docs-bar-label">Documents:</span>
      <span id="docs-empty" class="docs-bar-label">None uploaded</span>
    </div>

    <div id="chat-messages"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="message-input"
          placeholder="Type a message or ask about uploaded files..."
          rows="1"
        ></textarea>
        <button id="send-btn" type="button">Send</button>
      </div>
      <div class="controls">
        <div class="controls-left">
          <label>
            Temperature
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
          </label>
          <span id="temperature-value">0.7</span>
        </div>
        <div class="controls-right">
          <input type="file" id="file-input" hidden accept=".pdf,.txt,.md,.py,.js,.ts,.json,.csv,.html,.css,.log,.yaml,.yml,.sql">
          <button id="upload-btn" class="secondary-btn" type="button">+ Upload File</button>
          <button id="clear-btn" class="secondary-btn danger" type="button">Clear Chat</button>
        </div>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    // DOM elements
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const tempSlider = document.getElementById('temperature');
    const tempValue = document.getElementById('temperature-value');
    const statusEl = document.getElementById('status');
    const docsBar = document.getElementById('docs-bar');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const clearBtn = document.getElementById('clear-btn');

    // Show status message
    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    // Append a message to the chat UI
    function appendMessage(role, content, sources = []) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const label = document.createElement('div');
      label.className = 'role-label';
      label.textContent = role === 'user' ? 'You' : 'Assistant';
      div.appendChild(label);
      const text = document.createElement('div');
      text.textContent = content;
      div.appendChild(text);

      if (role === 'assistant' && sources && sources.length > 0) {
        const srcEl = document.createElement('div');
        srcEl.className = 'sources';
        srcEl.textContent = 'Sources: ' + sources.join(', ');
        div.appendChild(srcEl);
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Render uploaded document pills
    function renderDocuments(docs) {
      docsBar.innerHTML = '<span class="docs-bar-label">Documents:</span>';
      if (!docs || docs.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'docs-bar-label';
        empty.textContent = 'None uploaded';
        docsBar.appendChild(empty);
        return;
      }

      docs.forEach((doc) => {
        const pill = document.createElement('span');
        pill.className = 'doc-pill';

        const name = document.createElement('span');
        name.textContent = `${doc.filename} (${doc.chunks})`;
        pill.appendChild(name);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.title = 'Remove document';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => deleteDocument(doc.id));
        pill.appendChild(removeBtn);

        docsBar.appendChild(pill);
      });
    }

    async function loadDocuments() {
      try {
        const res = await fetch('/api/documents');
        const data = await res.json();
        renderDocuments(data.documents || []);
      } catch {
        // Ignore initial load error
      }
    }

    async function deleteDocument(docId) {
      try {
        const res = await fetch(`/api/documents/${docId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Could not delete document');
        await loadDocuments();
        setStatus('Document removed.');
      } catch (err) {
        setStatus('Error: ' + err.message, true);
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/history');
        const data = await res.json();
        messagesEl.innerHTML = '';
        (data.history || []).forEach((msg) => appendMessage(msg.role, msg.content));
      } catch {
        // Ignore initial load error
      }
    }

    // Show "typing" indicator
    function showTyping(show) {
      let el = document.getElementById('typing-indicator');
      if (show) {
        if (!el) {
          el = document.createElement('div');
          el.id = 'typing-indicator';
          el.className = 'message assistant typing';
          el.innerHTML = '<div class="role-label">Assistant</div><div>Thinking...</div>';
        }
        el.style.display = 'block';
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (el) {
        el.style.display = 'none';
      }
    }

    // Send user message to backend and display reply
    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      inputEl.value = '';
      sendBtn.disabled = true;
      appendMessage('user', message);
      showTyping(true);
      setStatus('');

      const temperature = parseFloat(tempSlider.value);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            temperature: temperature
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Request failed');
        }

        showTyping(false);
        appendMessage('assistant', data.reply, data.sources || []);
        setStatus('Model: ' + (data.model_used || '—'));
      } catch (err) {
        showTyping(false);
        setStatus('Error: ' + (err.message || 'Could not get response'), true);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Upload file handler
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      setStatus('Uploading ' + file.name + '...');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Upload failed');
        }
        await loadDocuments();
        setStatus(`Uploaded ${data.document.filename} (${data.document.chunks} chunks indexed)`);
      } catch (err) {
        setStatus('Upload error: ' + err.message, true);
      } finally {
        fileInput.value = '';
        uploadBtn.disabled = false;
      }
    });

    // Clear chat history
    clearBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/history', { method: 'DELETE' });
        if (!res.ok) throw new Error('Could not clear chat');
        messagesEl.innerHTML = '';
        setStatus('Chat history cleared.');
      } catch (err) {
        setStatus('Error: ' + err.message, true);
      }
    });

    // Send on button click
    sendBtn.addEventListener('click', sendMessage);

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Temperature slider label
    tempSlider.addEventListener('input', () => {
      tempValue.textContent = tempSlider.value;
    });

    // Check backend health and restore persisted history + documents on load
    fetch('/health')
      .then(r => r.json())
      .then((data) => {
        if (data.status === 'ok') {
          setStatus('Backend: ' + (data.backend || '—') + ', model: ' + (data.model || '—'));
        } else {
          setStatus('Backend: ' + (data.ollama || data.status || 'unknown'), true);
        }
      })
      .catch(() => setStatus('Could not reach backend', true));

    loadHistory();
    loadDocuments();
    inputEl.focus();
  </script>
</body>
</html>
